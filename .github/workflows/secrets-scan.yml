# COMMIT SINS - Secret Detection CI
#
# Runs the same detection engine as the web dashboard on every push and pull request.
# Reads the scanner from the repo, scans the changed files, and fails the check
# if any secrets are found.
#
# Usage:
#   1. Add the `pre-commit` directory to your repo.
#   2. Push to GitHub.
#   3. This workflow runs automatically on push and PRs.

name: Commit Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Scan changed files
        id: scan
        run: |
          # Get the list of changed files from the PR or the push
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Changed files from PR diff"
            git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} > changed-files.txt
          else
            echo "Changed files from push diff"
            git diff --name-only ${{ github.sha }}^ ${{ github.sha }} > changed-files.txt
          fi

          # Collect the changed files' content
          mkdir -p changed-files
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              # Build the new scanner payload format: one file per JSON object on stdin
              # The server expects: { files: [{ fileName, content }] }
              #
              # We use node to read each file and pipe the complete payload to the scanner endpoint
              # Since the server isn't running in CI, we run the scanner directly instead
              # (same engine, no network needed).
              echo "$file"
            fi
          done < changed-files.txt

          # Directly import and run the scanner via node.
          # This is the same scanFiles() function used by /api/scan.
          npx tsx -e "
            import { scanFiles } from './server/scanner.ts';
            const fs = await import('node:fs');
            const path = await import('node:path');
            const files = [];
            const { execSync } = await import('node:child_process');
            const changed = fs.readFileSync('changed-files.txt', 'utf-8').split('\n').filter(Boolean);
            for (const file of changed) {
              const content = fs.readFileSync(file, 'utf-8');
              files.push({ fileName: file, content });
            }
            const result = scanFiles(files);
            // Minimal output for CI
            console.log(JSON.stringify(result));
          " > scan-result.json

          cat scan-result.json
          echo "SCAN_RESULT=$(cat scan-result.json)" >> $GITHUB_ENV

      - name: Fail on findings
        if: github.event_name == 'pull_request'
        run: |
          # Mark the PR with failed status and comment
          echo "Scan results:"
          echo "${{ env.SCAN_RESULT }}"
          if echo "${{ env.SCAN_RESULT }}" | grep -q '"blocked"'; then
            echo "❌ Commit blocked: unsafe code detected."
            echo "Re-run your local scan:
              pnpm dev
            and fix the findings below."
            exit 1
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const results = process.env.SCAN_RESULT || '{"status":"unknown"}';
            const verdict = JSON.parse(results).status === 'blocked' ? 'blocked' : 'clean';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔐 COMMIT SINS scan result

              **Verdict: ${verdict}**

              ${JSON.stringify(JSON.parse(results), null, 2)}

              ${verdict === 'blocked' ? 'Fix the findings above before merging.' : 'This commit is safe to merge.'}`
            });
