# COMMIT SINS — secret detection CI
#
# Runs the same detection engine as the dashboard, the local hook and the API.
# Pull requests scan the files the PR changes; pushes to main scan every tracked
# file. The job fails when a finding is present. Output only ever contains the
# scanner's masked value, never the raw credential.

name: COMMIT SINS secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commit-sins-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Detect committed secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history lets the PR job resolve the base and head commits.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci --ignore-scripts

      - name: Run engine, API and hook tests
        run: npm --prefix backend test

      - name: Scan files changed by the pull request
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/scan-changed.js
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Scan every tracked file on push
        if: github.event_name == 'push'
        run: node scripts/scan-changed.js --all

      - name: Scan every tracked file manually
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/scan-changed.js --all
